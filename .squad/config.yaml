version: 1
project:
  name: ToDo List
  primaryLanguage: JavaScript
  projectRoots:
    - .
tracker:
  type: none
naming:
  includeTrackerId: false
  globalSequence: true
agents: []
planner:
  enabled: true
  provider: anthropic
  mode: auto
  budget:
    maxFileReads: 25
    maxContextBytes: 50000
    maxDurationSeconds: 180
  cache:
    enabled: true
  maxOutputTokens: 16384
